name: Ingest Backup Trigger

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-cron
  cancel-in-progress: false

jobs:
  trigger:
    name: Wake Backend & Trigger Ingest
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake backend, then trigger ingest
        env:
          BASE: ${{ secrets.STAGING_BACKEND_URL }}
          TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -z "$BASE" ] || [ -z "$TOKEN" ]; then
            echo '::warning::secrets STAGING_BACKEND_URL or INGEST_TOKEN missing';
            exit 0;
          fi

          echo "Waking backend at $BASE..."
          for i in 1 2 3 4 5 6 7 8 9; do
            if curl -fsS --max-time 20 "$BASE/api/v1/health" > /dev/null; then
              echo "Backend is awake."
              break
            fi
            echo "Waiting for backend spin-up ($i/9)..."
            sleep 10
          done

          echo "Triggering /api/v1/internal/ingest/run..."
          code=$(curl -s -o out.json -w '%{http_code}' --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "$BASE/api/v1/internal/ingest/run")

          echo "HTTP $code" >> $GITHUB_STEP_SUMMARY
          cat out.json || true
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
