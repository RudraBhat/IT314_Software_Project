name: Continuous Integration (CI)

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ============================================================================
  # 0. Path Filtering & Secret Scan
  # ============================================================================
  detect-changes:
    name: Changes / Path Filtering
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai-workers: ${{ steps.filter.outputs.ai-workers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Detect modified paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'ruff.toml'
              - '.github/workflows/ci.yml'
            ai-workers:
              - 'ai-workers/**'
              - 'ruff.toml'
              - '.github/workflows/ci.yml'

  security-secrets-scan:
    name: Security / GitLeaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 1. Frontend Quality, Linting & Build (Only if frontend changed)
  # ============================================================================
  frontend-check:
    name: Frontend / Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Cache Next.js build cache and ESLint cache
        uses: actions/cache@v4
        with:
          path: |
            ./frontend/.next/cache
            ./frontend/.eslintcache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/frontend/package-lock.json') }}-${{ hashFiles('**/frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Ban demo and mock data markers
        run: bash ../scripts/check_no_demo_data.sh

      - name: Run ESLint
        run: npm run lint -- --cache --cache-location .eslintcache

      - name: Verify Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Dependency vulnerability audit (High+Critical)
        run: npm audit --audit-level=high || true

  # ============================================================================
  # 2. Python Backend & AI Workers Quality Scan
  # ============================================================================
  python-check:
    name: Python / Lint, SAST & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            ai-workers/requirements.txt

      - name: Cache Ruff cache
        uses: actions/cache@v4
        with:
          path: .ruff_cache
          key: ${{ runner.os }}-ruff-${{ hashFiles('backend/**', 'ai-workers/**') }}
          restore-keys: ${{ runner.os }}-ruff-

      - name: Install code quality and security tools
        run: pip install ruff bandit pip-audit

      - name: Run Ruff linter
        run: ruff check backend/ ai-workers/ --no-fix

      - name: Run Bandit security scan (SAST)
        run: >
          bandit -r backend/ ai-workers/
          -ll -ii
          --skip B101,B311,B105,B106,B107,B301,B403,B404,B603,B607

      - name: Run pip-audit for known CVEs
        run: pip-audit -r backend/requirements.txt || true

  # ============================================================================
  # 3. Database Schema, Triggers & Backend Integration Tests (Consolidated Job)
  # ============================================================================
  backend-and-db-tests:
    name: Backend / Migrations, Triggers & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      JWT_SECRET: "ci_pipeline_jwt_secret_token_minimum_32_characters_key"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/drch_test"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/drch_test"
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply schema migrations and seeds with version tracking
        run: |
          psql -h localhost -U postgres -d drch_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS schema_migrations (
              version VARCHAR(255) PRIMARY KEY,
              applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
          );
          SQL

          echo "Checking and applying migrations in version order..."
          for file in $(find backend/db/migrations -maxdepth 1 -name '*.sql' | sort -V); do
            version=$(basename "$file")
            already=$(psql -h localhost -U postgres -d drch_test -t -A -c "SELECT 1 FROM schema_migrations WHERE version = '$version';")
            if [ "$already" = "1" ]; then
              echo "  [SKIP] Migration already applied: $version"
            else
              echo "  [APPLY] Migration: $version"
              psql -h localhost -U postgres -d drch_test -f "$file" -v ON_ERROR_STOP=1
              psql -h localhost -U postgres -d drch_test -c "INSERT INTO schema_migrations (version) VALUES ('$version');"
            fi
          done

          echo "Checking and applying seeds in version order..."
          for seed in $(find backend/db/seeds -mindepth 2 -maxdepth 2 -name '*.sql' | sort -t/ -k5,5 -V); do
            version="seeds/$(basename "$(dirname "$seed")")/$(basename "$seed")"
            already=$(psql -h localhost -U postgres -d drch_test -t -A -c "SELECT 1 FROM schema_migrations WHERE version = '$version';")
            if [ "$already" = "1" ]; then
              echo "  [SKIP] Seed already applied: $version"
            else
              echo "  [APPLY] Seed: $version"
              psql -h localhost -U postgres -d drch_test -f "$seed" -v ON_ERROR_STOP=1
              psql -h localhost -U postgres -d drch_test -c "INSERT INTO schema_migrations (version) VALUES ('$version');"
            fi
          done
          echo "All migrations and seeds evaluated successfully."

      - name: Verify audit log cryptographic hash trigger
        run: |
          psql -h localhost -U postgres -d drch_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO audit_logs (action, entity_type, result, rationale)
          VALUES ('CI_VERIFY_TRIGGER', 'system', 'SUCCESS', 'CI pipeline hash chain check');

          DO $$
          DECLARE
            v_hash TEXT;
          BEGIN
            SELECT row_hash INTO v_hash FROM audit_logs WHERE action = 'CI_VERIFY_TRIGGER';
            IF v_hash IS NULL OR length(v_hash) <> 64 THEN
              RAISE EXCEPTION 'Audit hash chain trigger failed: invalid row_hash (got: %)', COALESCE(v_hash, 'NULL');
            END IF;
            RAISE NOTICE 'Audit hash chain verified: %', v_hash;
          END;
          $$;
          SQL
          echo "Cryptographic audit hash chain trigger verified successfully."

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt pytest httpx pytest-asyncio

      - name: Run test suite with pytest & DB test execution guard
        working-directory: ./backend
        env:
          REQUIRE_DB_TESTS: "1"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Environment variable documentation check
        working-directory: .
        run: python scripts/check_env_docs.py

      - name: AI triage service tests
        working-directory: ./ai-workers
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests -v

      - name: Execute Core Loop Smoke Test (strict)
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/drch_test"
          JWT_SECRET: "ci_pipeline_jwt_secret_token_minimum_32_characters_key"
          DRCH_STAFF_PASSWORD: "Correct-Horse-Battery-9"
        run: |
          EMAIL="ci-smoke-$RANDOM@test.drch"
          OUT=$(python -m app.cli create-staff --email "$EMAIL" --name "CI Smoke Dispatcher" --permissions DISPATCH,CLOSURE)
          export SMOKE_STAFF_EMAIL="$EMAIL"
          export SMOKE_STAFF_PASSWORD="$DRCH_STAFF_PASSWORD"
          export SMOKE_STAFF_TOTP_SECRET="$(echo "$OUT" | awk '/Secret key/ {print $NF}')"
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 5
          python ../scripts/smoke.py --base-url http://127.0.0.1:8000
          STATUS=$?
          kill $SERVER_PID || true
          exit $STATUS

  # ============================================================================
  # 4. Container Build Validation (Matrix on Changed Components Only)
  # ============================================================================
  container-validation:
    name: Container / Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - detect-changes
      - frontend-check
      - python-check
      - backend-and-db-tests
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image_name: drch_backend
            enabled: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image_name: drch_frontend
            enabled: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
          - name: ai-workers
            context: ./ai-workers
            file: ./ai-workers/Dockerfile
            image_name: drch_ai_workers
            enabled: ${{ needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check if component should build
        id: check
        run: echo "should_run=${{ matrix.enabled }}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image with Buildx Layer Cache
        if: steps.check.outputs.should_run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.image_name }}:test
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Cache Trivy Vulnerability Database
        if: steps.check.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Run Trivy vulnerability scan
        if: steps.check.outputs.should_run == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ matrix.image_name }}:test
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          cache: true

  # ============================================================================
  # 5. CI Gatekeeper + Vercel Preview Deploy
  # ============================================================================
  ci-gatekeeper:
    name: Pipeline Status / Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    needs:
      - detect-changes
      - security-secrets-scan
      - frontend-check
      - python-check
      - backend-and-db-tests
      - container-validation
    if: always()
    steps:
      # ── Vercel Preview Deployment (runs BEFORE quality gate check) ──
      - name: Checkout repository for Vercel deployment
        if: |
          github.event_name == 'pull_request' &&
          needs.detect-changes.outputs.frontend == 'true' &&
          needs.frontend-check.result == 'success'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for Vercel CLI
        if: |
          github.event_name == 'pull_request' &&
          needs.detect-changes.outputs.frontend == 'true' &&
          needs.frontend-check.result == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Verified Preview to Vercel
        id: vercel_deploy
        if: |
          github.event_name == 'pull_request' &&
          needs.detect-changes.outputs.frontend == 'true' &&
          needs.frontend-check.result == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️ VERCEL_TOKEN secret is not set (e.g. fork PR). Skipping Vercel preview deployment."
            exit 0
          fi
          echo "Deploying preview to Vercel..."
          DEPLOY_OUTPUT=$(npx --yes vercel@latest deploy --token="$VERCEL_TOKEN" --yes)
          echo "$DEPLOY_OUTPUT"
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*vercel\.app' | tail -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*' | tail -n 1)
          fi
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Vercel did not return a preview URL."
            exit 1
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Vercel preview successfully deployed to: $PREVIEW_URL"
          {
            echo "## 🚀 Vercel Preview"
            echo "[$PREVIEW_URL]($PREVIEW_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment Preview URL on PR
        if: |
          github.event_name == 'pull_request' &&
          steps.vercel_deploy.outputs.url != ''
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.vercel_deploy.outputs.url }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) return;
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : context.issue.number;
            if (!prNumber) return;
            const body = `## 🚀 Vercel Preview\n\n🔗 **Preview URL:** ${url}\n\n_Deployed from commit \`${context.sha.substring(0, 7)}\`_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes('🚀 Vercel Preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      # ── Quality Gate (runs LAST with if: always()) ──
      - name: Evaluate pipeline execution status
        if: always()
        run: |
          echo "=== CI Job Results ==="
          echo "frontend-check:       ${{ needs.frontend-check.result }}"
          echo "python-check:         ${{ needs.python-check.result }}"
          echo "backend-and-db-tests: ${{ needs.backend-and-db-tests.result }}"
          echo "container-validation: ${{ needs.container-validation.result }}"
          echo "======================"

          is_ok() {
            case "$1" in
              success|skipped) return 0 ;;
              *) return 1 ;;
            esac
          }

          FAILED=""
          ! is_ok "${{ needs.frontend-check.result }}" && FAILED="$FAILED frontend-check"
          ! is_ok "${{ needs.python-check.result }}" && FAILED="$FAILED python-check"
          ! is_ok "${{ needs.backend-and-db-tests.result }}" && FAILED="$FAILED backend-and-db-tests"
          ! is_ok "${{ needs.container-validation.result }}" && FAILED="$FAILED container-validation"

          if [ -n "$FAILED" ]; then
            echo "CI check FAILED: the following job(s) did not succeed: $FAILED"
            exit 1
          fi
          echo "CI check PASSED: all required validation and security jobs succeeded."
