name: Continuous Deployment (CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================================================
  # 0. Detect Changed Directories
  # ============================================================================
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai-workers: ${{ steps.filter.outputs.ai-workers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'docker-compose*.yml'
              - '.github/workflows/cd.yml'
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'render.yaml'
              - '.github/workflows/cd.yml'
            ai-workers:
              - 'ai-workers/**'
              - 'docker-compose*.yml'
              - '.github/workflows/cd.yml'

  # ============================================================================
  # 1. Build and Publish Frontend Container to GHCR (Only if frontend changed)
  # ============================================================================
  publish-frontend:
    name: Publish Container / Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drch_frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push verified container to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================================
  # 2. Build and Publish Backend Container to GHCR (Only if backend changed)
  # ============================================================================
  publish-backend:
    name: Publish Container / Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drch_backend
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push verified container to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ============================================================================
  # 3. Build and Publish AI Workers Container to GHCR (Only if ai-workers changed)
  # ============================================================================
  publish-ai-workers:
    name: Publish Container / AI Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drch_ai_workers
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push verified container to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./ai-workers
          file: ./ai-workers/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai-workers
          cache-to: type=gha,mode=max,scope=ai-workers

  # ============================================================================
  # 4. Production Deployment: Trigger Respective Deployments
  # ============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, publish-frontend, publish-backend, publish-ai-workers]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Vercel Production Deployment (Frontend Only)
        if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then
            echo "🚀 Triggering Vercel frontend deployment..."
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_HOOK")
            if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
              echo "✅ Successfully dispatched Vercel build (HTTP $response)."
            else
              echo "⚠️ Vercel hook responded with HTTP $response. Please check secret VERCEL_DEPLOY_HOOK."
            fi
          else
            echo "ℹ️ VERCEL_DEPLOY_HOOK secret not set. Skipping Vercel trigger."
          fi

      - name: Trigger Render Production Deployment (Backend Only)
        if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "🚀 Triggering Render backend deployment..."
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_HOOK")
            if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
              echo "✅ Successfully dispatched Render deployment (HTTP $response)."
            else
              echo "⚠️ Render hook responded with HTTP $response. Please check secret RENDER_DEPLOY_HOOK."
            fi
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK secret not set. Skipping Render trigger."
          fi

      - name: Verify Backend Production Health
        if: ${{ (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai-workers == 'true' || github.event_name == 'workflow_dispatch') }}
        env:
          PROD_BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
        run: |
          if [ -n "$PROD_BACKEND_URL" ]; then
            PROD_BACKEND_URL="${PROD_BACKEND_URL%/}"
            echo "Waiting for production backend to complete deployment rollout at $PROD_BACKEND_URL..."
            sleep 10
            for i in $(seq 1 30); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_BACKEND_URL/health" || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "✅ Production backend healthcheck passed (HTTP 200)."
                exit 0
              fi
              echo "Polling $PROD_BACKEND_URL/health - attempt $i/30 (got HTTP $HTTP_STATUS), retrying in 5s..."
              sleep 5
            done
            echo "⚠️ Health check timed out or failed on $PROD_BACKEND_URL/health"
          else
            echo "ℹ️ PROD_BACKEND_URL secret not set. Skipping live health verification."
          fi

  # ============================================================================
  # 5. Live Staging Smoke Gate (Live-SHA Verified)
  # ============================================================================
  smoke:
    name: Staging Smoke / Live SHA Verification
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      API_URL: ${{ secrets.STAGING_BACKEND_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Smoke Test Dependencies
        run: |
          pip install httpx pyotp

      - name: Wait until this commit is live
        run: |
          if [ -z "$API_URL" ]; then
            echo "::notice::STAGING_BACKEND_URL secret not set in GitHub Secrets. Skipping staging live version verification."
            exit 0
          fi
          API_URL="${API_URL%/}"
          echo "Waiting for live commit ${{ github.sha }} on $API_URL..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o out.json -w "%{http_code}" --max-time 20 "$API_URL/api/v1/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              v=$(jq -r .version out.json 2>/dev/null || echo "unknown")
              echo "Polling attempt $i/30: HTTP 200, version '$v'"
              if [ "$v" = "${{ github.sha }}" ]; then
                echo "Deployed build is live."
                exit 0
              fi
            else
              echo "Polling attempt $i/30: got HTTP $HTTP_CODE"
            fi
            sleep 10
          done
          echo "::warning::New build ${{ github.sha }} not live on $API_URL after 5 minutes."
          exit 0

      - name: Run Staging Smoke Test
        if: ${{ env.API_URL != '' }}
        env:
          SMOKE_STAFF_EMAIL: ${{ secrets.SMOKE_STAFF_EMAIL }}
          SMOKE_STAFF_PASSWORD: ${{ secrets.SMOKE_STAFF_PASSWORD }}
          SMOKE_STAFF_TOTP_SECRET: ${{ secrets.SMOKE_STAFF_TOTP_SECRET }}
        run: |
          python scripts/smoke.py --base-url "$API_URL" --scenario field-loop
