# Three Render web services, all images built by cd.yml and published to GHCR:
#   drch-backend-latest               staging, https://drch-backend-latest.onrender.com; deployed first on every
#                                     merge to main, then smoke-tested (RENDER_STAGING_DEPLOY_HOOK, STAGING_BACKEND_URL)
#   it314-software-project-backend1   production, https://it314-software-project-backend1.onrender.com; deployed only
#                                     after the staging smoke test passed (RENDER_DEPLOY_HOOK, PROD_BACKEND_URL)
#   drch-ai-triage                    advisory triage service shared by both backends (RENDER_AI_DEPLOY_HOOK)
# The two backend names match the services that already exist in Render, so a Blueprint sync updates them
# instead of creating new ones; if a service was renamed in the dashboard, change the name here to match.
# Citizen photos are stored in the database (evidence_blobs, migration 11), so no storage service or
# bucket is needed; moving them to Cloudinary is planned later (docs/ARCHITECTURE.md, "Photo storage").
# Give staging its own database (for example a separate Neon branch) and its own JWT_SECRET and
# MFA_ENCRYPTION_KEY, so a token or staff login from one environment never works on the other.
# Only keys without a built-in default are listed. Every `sync: false` key is entered in the Render
# dashboard; see docs/env-variables.md for the rest (SMTP_PORT, INGEST_INTERVAL_SECONDS,
# NEWS_RSS_ENABLED and BLUESKY_SEARCH_ENABLED all default correctly).
services:
  - type: web
    name: drch-backend-latest
    runtime: image
    image:
      url: ghcr.io/siddhcreator-1706/it314_software_project/drch_backend:latest
    plan: free
    region: ohio
    autoDeploy: false

    healthCheckPath: /api/v1/health   # also reports database reachability
    envVars:
      # staging keeps every startup secret check but allows the sandbox (mock) donation flow.
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false          # the staging database, never the production one
      - key: JWT_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # staging has no frontend of its own; any valid origin (the Vercel URL) satisfies the startup check
      - key: FRONTEND_URL
        sync: false
      - key: AI_TRIAGE_URL
        sync: false          # https://<drch-ai-triage>.onrender.com/triage; empty = triage unavailable
      - key: AI_TRIAGE_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false          # empty = emails are only logged, not sent
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MOCK_GATEWAY_SECRET
        sync: false
      - key: SACHET_FEED_URL
        value: https://sachet.ndma.gov.in/cap_public_website/rss/rss_gujarat.xml

  - type: web
    name: it314-software-project-backend1
    runtime: image
    image:
      url: ghcr.io/siddhcreator-1706/it314_software_project/drch_backend:latest
    plan: free
    region: ohio
    autoDeploy: false

    healthCheckPath: /api/v1/health
    envVars:
      # production refuses the sandbox (mock) payment endpoint, so with PAYMENT_GATEWAY=mock donations
      # cannot be completed here. For donations set PAYMENT_GATEWAY=razorpay and the three RAZORPAY_* keys
      # (the backend refuses to start with razorpay and a missing key); otherwise leave it as mock.
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false          # same Vercel URL; used in invitation and password-reset email links
      - key: AI_TRIAGE_URL
        sync: false
      - key: AI_TRIAGE_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false          # same value as NEXT_PUBLIC_GOOGLE_CLIENT_ID on Vercel; empty = Google sign-in off
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYMENT_GATEWAY
        sync: false          # mock (default) or razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SACHET_FEED_URL
        value: https://sachet.ndma.gov.in/cap_public_website/rss/rss_gujarat.xml

  # S2-06 / S3-12: advisory triage service (ai-workers image, published by cd.yml). Both backends reach it
  # through AI_TRIAGE_URL = https://<this service>.onrender.com/triage. All three services must share the same
  # AI_TRIAGE_TOKEN value. Without this service the backend answers triage with UNAVAILABLE and staff
  # continue manually. The service is advisory only: it never changes an incident.
  - type: web
    name: drch-ai-triage
    runtime: image
    image:
      url: ghcr.io/siddhcreator-1706/it314_software_project/drch_ai_workers:latest
    plan: free
    region: ohio
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8001"        # the image listens on 8001 (ai-workers/Dockerfile)
      - key: AI_TRIAGE_TOKEN
        sync: false          # same value as AI_TRIAGE_TOKEN on both backends
