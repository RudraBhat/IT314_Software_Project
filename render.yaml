services:
  - type: web
    name: drch-backend
    runtime: image
    image:
      url: ghcr.io/siddhcreator-1706/it314_software_project/drch_backend:latest
    plan: free
    region: ohio
    autoDeploy: false

    healthCheckPath: /api/v1/health   # also reports database reachability
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      - key: AI_TRIAGE_URL
        sync: false
      - key: AI_TRIAGE_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: PAYMENT_GATEWAY
        value: mock
      - key: MOCK_GATEWAY_SECRET
        sync: false
