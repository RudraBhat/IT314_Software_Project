version: '3.8'

services:
  # ------------------------------------------------------------------------------
  # Core Infrastructure
  # ------------------------------------------------------------------------------
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: drch_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-drch_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-drch_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------------------
  # Application Services
  # ------------------------------------------------------------------------------
  frontend:
    image: drch_frontend:latest
    build:
      context: ./frontend
    container_name: drch_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - API_URL=http://backend:8000
    # No bind mount: the image runs the standalone production build. For hot reload run `npm run dev` in ./frontend.
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: drch_backend:latest
    build:
      context: ./backend
    container_name: drch_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-postgis:5432/${POSTGRES_DB:-drch_db}
      - APP_ENV=development
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      - AI_TRIAGE_URL=${AI_TRIAGE_URL:-http://ai-workers:8001/triage}
      - AI_TRIAGE_TOKEN=${AI_TRIAGE_TOKEN:-}
      - MOCK_GATEWAY_SECRET=${MOCK_GATEWAY_SECRET:-dev-only-mock-gateway-secret-0123456789}
      - GIT_SHA=${GIT_SHA:-dev}
    volumes:
      - ./backend:/app
    depends_on:
      postgres-postgis:
        condition: service_healthy

  ai-workers:
    image: drch_ai_workers:latest
    build:
      context: ./ai-workers
    container_name: drch_ai_workers
    ports:
      - "8001:8001"
    environment:
      - AI_TRIAGE_TOKEN=${AI_TRIAGE_TOKEN:-}

volumes:
  pgdata:
