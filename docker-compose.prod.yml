version: '3.8'

services:
  # ------------------------------------------------------------------------------
  # Core Infrastructure
  # ------------------------------------------------------------------------------
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: drch_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-drch_db}
    # No host port: only the backend (same compose network) talks to the database.
    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-drch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------------------
  # Application Services (Built from Production Container Registry)
  # ------------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/siddhcreator-1706/it314_software_project/drch_frontend:latest}
    container_name: drch_prod_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - API_URL=${API_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/siddhcreator-1706/it314_software_project/drch_backend:latest}
    container_name: drch_prod_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@postgres-postgis:5432/${POSTGRES_DB:-drch_db}
      - JWT_SECRET=${JWT_SECRET:?}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?}
      - INGEST_TOKEN=${INGEST_TOKEN:?}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?}
      - AI_TRIAGE_URL=${AI_TRIAGE_URL:-http://ai-workers:8001/triage}
      - AI_TRIAGE_TOKEN=${AI_TRIAGE_TOKEN:-}
      - PAYMENT_GATEWAY=mock
      - MOCK_GATEWAY_SECRET=${MOCK_GATEWAY_SECRET:?}
      - GIT_SHA=${GIT_SHA:-unknown}
    depends_on:
      postgres-postgis:
        condition: service_healthy

  ai-workers:
    image: ${AI_WORKERS_IMAGE:-ghcr.io/siddhcreator-1706/it314_software_project/drch_ai_workers:latest}
    container_name: drch_prod_ai_workers
    restart: always
    environment:
      - AI_TRIAGE_TOKEN=${AI_TRIAGE_TOKEN:-}

volumes:
  pgdata:
